services:
  - type: web
    name: gnist
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: Party__FrontendBaseUrl
        value: https://dbaredon.github.io/havefun
      - key: DATABASE_URL
        fromDatabase:
          name: gnist-db
          property: connectionString

databases:
  - name: gnist-db
    databaseName: gnist
    user: gnist
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []
