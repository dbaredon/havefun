name: Publish UI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Test frontend navigation
        run: node --test tests/frontend/*.test.cjs
      - name: Export the real UI as static HTML
        env:
          GNIST_API_URL: ${{ vars.GNIST_API_URL }}
          GNIST_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: dotnet run --project tools/Gnist.Export/Gnist.Export.csproj --configuration Release -- artifacts/pages
      - name: Check exported pages and assets
        run: python3 tools/check_pages.py artifacts/pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
