name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: gnist-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GNIST_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=gnist-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore minigames.sln
      - run: dotnet build minigames.sln --configuration Release --no-restore
      - run: dotnet test tests/Gnist.Tests/Gnist.Tests.csproj --configuration Release --no-build --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/Gnist.Tests/TestResults/*.trx
